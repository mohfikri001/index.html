async function initializeApp() {
    // DITAMBAHKAN: Pengecekan apakah window.dataSdk sudah terdefinisi.
    if (window.dataSdk) { 
        const initResult = await window.dataSdk.init(dataHandler);

            console.error("Gagal menginisialisasi Data SDK");
        }
    } else {
        // Log peringatan jika SDK tidak ditemukan, tetapi biarkan aplikasi berjalan
        console.warn("Data SDK (data_sdk.js) tidak ditemukan. Fitur penyimpanan riwayat akan dinonaktifkan.");
    }
}

        function setupTabSystem(config) {
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => {
                        b.classList.remove('active');
                        b.style.background = 'transparent';
                    });
                    btn.classList.add('active');
                    btn.style.background = config.card_color || defaultConfig.card_color;
                    currentTab = btn.dataset.tab;
                    renderTabContent(config);
                });
            });
        }

        function renderTabContent(config) {
            const content = document.getElementById('tab-content');
            const baseSize = config.font_size || defaultConfig.font_size;
            
            if (currentTab === 'kalkulator') {
                renderKalkulator(content, config, baseSize);
            } else if (currentTab === 'materi') {
                renderMateri(content, config, baseSize);
            } else if (currentTab === 'latihan') {
                renderLatihan(content, config, baseSize);
            } else if (currentTab === 'statistik') {
                renderStatistik(content, config, baseSize);
            }
        }

            const achievements = [
                { icon: "🌟", nama: "Pemula", kondisi: totalSoal >= 1, tercapai: totalSoal >= 1 },
                { icon: "⭐", nama: "Rajin Latihan", kondisi: totalSoal >= 10, tercapai: totalSoal >= 10 },
                { icon: "🏆", nama: "Master", kondisi: akurasi >= 90 && totalSoal >= 10, tercapai: akurasi >= 90 && totalSoal >= 10 },
                { icon: "🔥", nama: "Streak 5", kondisi: quizScore.streak >= 5, tercapai: quizScore.streak >= 5 },
                { icon: "💯", nama: "Perfect!", kondisi: akurasi === 100 && totalSoal >= 5, tercapai: akurasi === 100 && totalSoal >= 5 },
                { icon: "🧮", nama: "Kalkulator Pro", kondisi: totalPerhitungan >= 20, tercapai: totalPerhitungan >= 20 },
                { icon: "📚", nama: "Pelajar Aktif", kondisi: totalSoal >= 50, tercapai: totalSoal >= 50 },
                { icon: "🎓", nama: "Juara!", kondisi: totalSoal >= 100, tercapai: totalSoal >= 100 }
            ];
            
            return achievements.map(ach => `
                <div class="p-4 rounded-lg text-center transition-all ${ach.tercapai ? 'transform hover:scale-110' : ''}" style="background: ${ach.tercapai ? config.primary_button_color : config.background_color}${ach.tercapai ? '' : '20'}; ${ach.tercapai ? 'border: 2px solid ' + (config.primary_button_color || defaultConfig.primary_button_color) : ''}">

        }

        function setupKalkulatorListeners(config) {
            const hitungBtn = document.getElementById('hitung-btn');
            const bilanganInput = document.getElementById('bilangan');
            const pangkatInput = document.getElementById('pangkat');

            hitungBtn.addEventListener('click', async () => {
                if (isLoading) return;

                const bilangan = parseFloat(bilanganInput.value);
                const pangkat = parseFloat(pangkatInput.value);

                if (isNaN(bilangan) || isNaN(pangkat)) {
                    showToast('Mohon masukkan bilangan dan pangkat yang valid!', config);
                    return;
                }

                if (riwayatData.length >= 999) {
                    showToast('Batas maksimum 999 riwayat tercapai!', config);
                    return;
                }

                isLoading = true;
                hitungBtn.disabled = true;
                hitungBtn.style.opacity = '0.6';
                hitungBtn.textContent = 'Menghitung...';

                const hasil = Math.pow(bilangan, pangkat);
                showHasil(bilangan, pangkat, hasil, config);

                const newRecord = {
                    id: Date.now().toString(),
                    bilangan: bilangan,
                    pangkat: pangkat,
                    hasil: hasil,
                    waktu: new Date().toISOString()
                };

                const createResult = await window.dataSdk.create(newRecord);
                
                isLoading = false;
                hitungBtn.disabled = false;
                hitungBtn.style.opacity = '1';
                hitungBtn.textContent = '✨ Hitung Sekarang!';

                if (createResult.isOk) {
                    bilanganInput.value = '';
                    pangkatInput.value = '';
                } else {
                    showToast('Gagal menyimpan riwayat', config);
                }
            });
        }

        function showHasil(bilangan, pangkat, hasil, config) {
            const hasilContainer = document.getElementById('hasil-container');
            const rumusEl = document.getElementById('rumus');
            const hasilEl = document.getElementById('hasil');
            const penjelasanEl = document.getElementById('penjelasan');

            rumusEl.textContent = `${bilangan}${getPangkatSuperscript(pangkat)}`;
            hasilEl.textContent = `= ${formatHasil(hasil)}`;
            
            let penjelasan = "";
            if (pangkat === 0) {
                penjelasan = `💡 Bilangan apapun (kecuali 0) yang dipangkatkan 0 hasilnya selalu 1.`;
            } else if (pangkat < 0) {
                penjelasan = `💡 Pangkat negatif berarti kebalikan: ${bilangan}^${pangkat} = 1/(${bilangan}^${Math.abs(pangkat)}) = ${formatHasil(hasil)}`;
            } else if (pangkat > 0 && pangkat < 1) {
                penjelasan = `💡 Pangkat pecahan adalah akar: ${bilangan}^${pangkat} adalah akar dari ${bilangan}`;
            } else if (pangkat === 1) {
                penjelasan = `💡 Bilangan apapun dipangkatkan 1 hasilnya adalah bilangan itu sendiri.`;
            } else {
                penjelasan = `💡 ${bilangan}^${pangkat} berarti ${bilangan} dikalikan sebanyak ${pangkat} kali.`;
            }
            penjelasanEl.textContent = penjelasan;
            
            hasilContainer.classList.remove('hidden');
            hasilContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function getPangkatSuperscript(pangkat) {
            const superscriptMap = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '.': '·'
            };
            return pangkat.toString().split('').map(char => superscriptMap[char] || char).join('');
        }

        function formatHasil(hasil) {
            if (Number.isInteger(hasil)) {
                return hasil.toLocaleString('id-ID');
            }
            if (Math.abs(hasil) < 0.0001 || Math.abs(hasil) > 1000000) {
                return hasil.toExponential(4);
            }
            return hasil.toFixed(6).replace(/\.?0+$/, '');
        }

        function renderRiwayat() {
            const riwayatList = document.getElementById('riwayat-list');
            const emptyState = document.getElementById('empty-state');
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;

            if (!riwayatData || riwayatData.length === 0) {
                if (riwayatList) riwayatList.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            const sortedData = [...riwayatData].sort((a, b) => new Date(b.waktu) - new Date(a.waktu)).slice(0, 10);

            if (riwayatList) {
                const existingItems = new Map([...riwayatList.children].map(el => [el.dataset.itemId, el]));

                sortedData.forEach(item => {
                    if (existingItems.has(item.id)) {
                        existingItems.delete(item.id);
                    } else {
                        const itemEl = createRiwayatItem(item, config);
                        riwayatList.appendChild(itemEl);
                    }
                });

                existingItems.forEach(el => el.remove());
            }
        }

        function createRiwayatItem(item, config) {
            const div = document.createElement('div');
            div.dataset.itemId = item.id;
            div.className = 'p-5 rounded-xl border-3 flex justify-between items-center hover:shadow-xl transition-all transform hover:scale-102';
            div.style.borderColor = `${config.primary_button_color || defaultConfig.primary_button_color}60`;
            div.style.background = `linear-gradient(135deg, ${config.card_color || defaultConfig.card_color}, ${config.background_color || defaultConfig.background_color}05)`;
            
            const baseSize = config.font_size || defaultConfig.font_size;
            
            div.innerHTML = `
                <div class="flex items-center gap-3 flex-1">
                    <div class="text-3xl">🔢</div>
                    <div class="flex-1">
                        <p class="font-bold mb-1" style="font-size: ${baseSize * 1.2}px; color: ${config.text_color || defaultConfig.text_color}">
                            ${item.bilangan}${getPangkatSuperscript(item.pangkat)} = ${formatHasil(item.hasil)}
                        </p>
                        <p class="flex items-center gap-1 text-sm" style="font-size: ${baseSize * 0.8}px; color: ${config.text_color || defaultConfig.text_color}; opacity: 0.7">
                            <span>🕐</span> ${new Date(item.waktu).toLocaleString('id-ID')}
                        </p>
                    </div>
                </div>
                <button class="px-5 py-3 rounded-lg font-bold text-white transition-all hover:scale-110 active:scale-95 shadow-md flex items-center gap-2" style="font-size: ${baseSize * 0.9}px; background: ${config.secondary_button_color || defaultConfig.secondary_button_color}" data-delete-id="${item.id}">
                    <span>🗑️</span><span>Hapus</span>
                </button>
            `;

            const deleteBtn = div.querySelector('[data-delete-id]');
            deleteBtn.addEventListener('click', async () => {
                if (isLoading) return;
                isLoading = true;
                deleteBtn.disabled = true;
                deleteBtn.style.opacity = '0.6';
                deleteBtn.innerHTML = '<span>Menghapus...</span>';

                const deleteResult = await window.dataSdk.delete(item);
                isLoading = false;

                if (!deleteResult.isOk) {
                    deleteBtn.disabled = false;
                    deleteBtn.style.opacity = '1';
                    deleteBtn.innerHTML = '<span>🗑️</span><span>Hapus</span>';
                    showToast('Gagal menghapus riwayat', config);
                }
            });

            return div;
        }

        function updateStatistik() {
            if (currentTab === 'statistik') {
                renderTabContent(window.elementSdk ? window.elementSdk.config : defaultConfig);
            }
        }

        function setupModalListeners() {
            const developerMenuBtn = document.getElementById('developer-menu-btn');
            const developerModal = document.getElementById('developer-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');

            developerMenuBtn.addEventListener('click', () => {
                developerModal.classList.remove('hidden');
            });

            closeModalBtn.addEventListener('click', () => {
                developerModal.classList.add('hidden');
            });

            developerModal.addEventListener('click', (e) => {
                if (e.target === developerModal) {
                    developerModal.classList.add('hidden');
                }
            });
        }

        function showToast(message, config) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white font-semibold z-50 transition-opacity';
            toast.style.background = config.secondary_button_color || defaultConfig.secondary_button_color;
            toast.style.fontSize = `${(config.font_size || defaultConfig.font_size) * 0.9}px`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function onConfigChange(config) {
            const customFont = config.font_family || defaultConfig.font_family;
            const baseFontStack = 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif';
            const baseSize = config.font_size || defaultConfig.font_size;

            const app = document.getElementById('app');
            if (app) {
                app.style.background = config.background_color || defaultConfig.background_color;
                app.style.fontFamily = `${customFont}, ${baseFontStack}`;
            }

            const judul = document.getElementById('judul');
            if (judul) {
                judul.textContent = config.judul_aplikasi || defaultConfig.judul_aplikasi;
                judul.style.fontSize = `${baseSize * 2}px`;
                judul.style.color = config.card_color || defaultConfig.card_color;
            }

            const subjudul = document.getElementById('subjudul');
            if (subjudul) {
                subjudul.textContent = config.subjudul || defaultConfig.subjudul;
                subjudul.style.fontSize = `${baseSize}px`;
                subjudul.style.color = config.card_color || defaultConfig.card_color;
            }
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig: defaultConfig,
                onConfigChange: onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [
                        {
                            get: () => config.background_color || defaultConfig.background_color,
                            set: (value) => {
                                config.background_color = value;
                                window.elementSdk.setConfig({ background_color: value });
                            }
                        },
                        {
                            get: () => config.card_color || defaultConfig.card_color,
                            set: (value) => {
                                config.card_color = value;
                                window.elementSdk.setConfig({ card_color: value });
                            }
                        },
                        {
                            get: () => config.text_color || defaultConfig.text_color,
                            set: (value) => {
                                config.text_color = value;
                                window.elementSdk.setConfig({ text_color: value });
                            }
                        },
                        {
                            get: () => config.primary_button_color || defaultConfig.primary_button_color,
                            set: (value) => {
                                config.primary_button_color = value;
                                window.elementSdk.setConfig({ primary_button_color: value });
                            }
                        },
                        {
                            get: () => config.secondary_button_color || defaultConfig.secondary_button_color,
                            set: (value) => {
                                config.secondary_button_color = value;
                                window.elementSdk.setConfig({ secondary_button_color: value });
                            }
                        }
                    ],
                    borderables: [],
                    fontEditable: {
                        get: () => config.font_family || defaultConfig.font_family,
                        set: (value) => {
                            config.font_family = value;
                            window.elementSdk.setConfig({ font_family: value });
                        }
                    },
                    fontSizeable: {
                        get: () => config.font_size || defaultConfig.font_size,
                        set: (value) => {
                            config.font_size = value;
                            window.elementSdk.setConfig({ font_size: value });
                        }
                    }
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["judul_aplikasi", config.judul_aplikasi || defaultConfig.judul_aplikasi],
                    ["subjudul", config.subjudul || defaultConfig.subjudul]
                ])
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initializeApp();
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            renderUI(config);
        });
    </script>
 </body>
</html>
